<script>
(function(){
  var q = new URLSearchParams(location.search);
  function go(){ location.replace(location.pathname + '?' + q.toString()); }
  // trình duyệt còn giữ trang của bản cũ: hỏi bản mới nhất rồi tự mở lại đúng bản (không cần người chơi tải lại)
  var PAGE_V = 'g2610291014';
  try {
    fetch('version.json?t=' + Date.now(), {cache: 'no-store'}).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.v && j.v !== PAGE_V && q.get('v') !== j.v) { q.set('v', j.v); go(); }
    }).catch(function(){});
  } catch (e) {}
  // máy này từng bị "mất WebGL" với đúng bản này: mở thẳng chế độ nhẹ (bản mới thì thử lại chế độ đẹp)
  try { if (localStorage.getItem('thnq_gfx') === PAGE_V && !q.has('safe') && !q.has('gem')) { q.set('safe', '1'); go(); return; } } catch (e) {}
  // card đồ hoạ không kham nổi: không báo lỗi, tự mở lại ở chế độ nhẹ
  window.addEventListener('webglcontextlost', function(e){
    e.stopImmediatePropagation();
    if (q.get('safe') !== '1') {
      try { localStorage.setItem('thnq_gfx', PAGE_V); } catch (_) {}
      q.set('safe', '1'); go();
    } else {
      document.body.innerHTML = '<p style="color:#fff;font:20px sans-serif;padding:40px">Máy này không chạy được đồ hoạ 3D của game. Hãy thử trình duyệt Chrome hoặc máy khác.</p>';
    }
  }, true);
  // gỡ bộ nhớ đệm của bản cũ (bản cũ dùng service worker giữ file lại)
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
  if (window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
})();
</script>
<script>
(function(){
  var ua = navigator.userAgent || '';
  var inapp = /Zalo|FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|MicroMessenger|TikTok|Snapchat/i.test(ua);
  function box(html, top){
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:12px;right:12px;' + (top ? 'top:12px' : 'bottom:12px') + ';z-index:99999;background:rgba(20,16,12,.94);color:#ffe3b0;font:16px/1.45 -apple-system,Segoe UI,Arial,sans-serif;padding:14px 16px;border-radius:12px;border:1px solid #a07840;text-align:center';
    d.innerHTML = html;
    document.body.appendChild(d);
    return d;
  }
  window.addEventListener('DOMContentLoaded', function(){
    // mở trong ứng dụng chat (Zalo, Messenger…): trình duyệt thu nhỏ hay thiếu bộ nhớ cho game 3D
    if (inapp) box('Bạn đang mở game bên trong ứng dụng chat. Nếu game không chạy, bấm <b>⋯</b> rồi chọn <b>Mở bằng trình duyệt</b> (Safari / Chrome).', true);
    // tải quá lâu mà game chưa mở: báo cách xử lý thay vì để người chơi chờ mãi
    setTimeout(function(){
      var st = document.getElementById('status');
      if (st && st.style.visibility !== 'hidden' && document.body.contains(st)) {
        box('Game mở lâu hơn bình thường. Hãy chờ thêm chút, hoặc <b>tải lại trang</b>.' + (inapp ? ' Tốt nhất mở bằng <b>Safari / Chrome</b>.' : '') + '<br><small>Cần trình duyệt mới (Chrome, Edge, Safari 16 trở lên).</small>', false);
      }
    }, 75000);
  });
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"g2610291014","experimentalVK":false,"fileSizes":{"g2610291014.pck":32760736,"g2610291014.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
